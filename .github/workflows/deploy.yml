name: Deploy (build on runner, ship over SSH)

on:
  push:
    branches:
      - zf-ai-labs
  workflow_dispatch: {}

# One production deploy at a time. A newer push waits for the running one to
# finish rather than racing it on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # --- Build-time app env (NEXT_PUBLIC_* get inlined into the bundle here) ---
      WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
      WORDPRESS_AUTH_REFRESH_TOKEN: ${{ secrets.WORDPRESS_AUTH_REFRESH_TOKEN }}
      WORDPRESS_PREVIEW_SECRET: ${{ secrets.WORDPRESS_PREVIEW_SECRET }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_MEDIA_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_URL }}
      NEXT_PUBLIC_IMGIX_URL: ${{ secrets.NEXT_PUBLIC_IMGIX_URL }}
      NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
      NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_ENV: ${{ secrets.NEXT_PUBLIC_ENV }}
      # Enables Sentry source-map upload during the build.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Standalone output does not include the static assets or /public — copy
      # them next to server.js so the shipped bundle can serve on its own.
      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

          # Guard added 2026-08-18 after a deploy left the server running a new
          # build whose JS chunks were not on disk: every /_next/static/chunks/*
          # returned 404 while /_next/static/css/* and /public served fine, so
          # the HTML rendered but nothing hydrated - no headings, no sections.
          # A bundle without chunks is not shippable; fail here instead.
          test -d .next/standalone/.next/static/chunks
          CHUNKS=$(find .next/standalone/.next/static/chunks -name '*.js' | wc -l | tr -d ' ')
          echo "static/chunks JS files: $CHUNKS"
          test "$CHUNKS" -gt 0

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key from a secret if provided; otherwise trust-on-first-use.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ship bundle to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes"
          # Ensure target dir exists, then sync the assembled bundle.
          # --delete removes files no longer in the build; .env lives outside
          # this tree (written in the next step) so it is never touched.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/current'"
          # `--delete` REMOVED 2026-08-18. DO NOT PUT IT BACK without a
          # two-directory (build-then-symlink-swap) release layout.
          # Assets here are content-hashed, so a new build never overwrites an
          # old file - it only adds. `--delete` bought nothing except a window,
          # from the first deleted file until PM2 finished reloading, in which
          # the running server's own chunks were gone from disk. Anyone loading
          # the site in that window got HTML pointing at 404s. Worse, if a sync
          # ends early for any reason, `--delete` has already destroyed the
          # assets the currently-running build needs, and the site stays broken
          # until the next successful deploy.
          # Without it a partial sync is harmless: old files keep serving until
          # the new ones are fully in place and PM2 swaps over.
          rsync -az \
            -e "ssh $SSH_OPTS" \
            .next/standalone/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/current/"

      - name: Write runtime env + reload PM2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes"

          # Build the runtime .env locally from secrets, then copy it up. Only
          # server-side vars matter at runtime (NEXT_PUBLIC_* are already inlined),
          # but writing the full set keeps the file self-documenting.
          cat > runtime.env <<'EOF'
          NODE_ENV=production
          PORT=3000
          HOSTNAME=127.0.0.1
          WORDPRESS_API_URL=${{ secrets.WORDPRESS_API_URL }}
          WORDPRESS_AUTH_REFRESH_TOKEN=${{ secrets.WORDPRESS_AUTH_REFRESH_TOKEN }}
          WORDPRESS_PREVIEW_SECRET=${{ secrets.WORDPRESS_PREVIEW_SECRET }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_MEDIA_URL=${{ secrets.NEXT_PUBLIC_MEDIA_URL }}
          NEXT_PUBLIC_IMGIX_URL=${{ secrets.NEXT_PUBLIC_IMGIX_URL }}
          NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV }}
          EOF

          # Land .env at the app root (one level above the synced bundle).
          # Piped over the ssh shell channel instead of scp: modern scp uses the
          # SFTP subsystem, which is disabled on many hardened servers even when
          # shell/rsync work fine (the "Connection closed" failure mode).
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cat > '$DEPLOY_PATH/.env'" < runtime.env
          rm -f runtime.env

          # Reload the app. startOrReload is idempotent: it starts the app on the
          # first deploy and does a zero-downtime reload on subsequent ones.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && pm2 startOrReload ecosystem.config.js --update-env && pm2 save"

      # Added 2026-08-18. The deploy that broke the site reported success:
      # rsync was fine, PM2 reloaded, the homepage returned 200 - and every
      # script tag in that 200 pointed at a 404. Nothing in the pipeline looked
      # at what the site actually served. This step does.
      - name: Smoke test the deployed page
        run: |
          set -euo pipefail
          URL="https://wdi-wow.online/"

          # Give PM2 a moment to finish swapping the process.
          sleep 15

          HTML=$(curl -fsS --max-time 30 "$URL")
          BUILD_ID=$(printf '%s' "$HTML" | grep -o '"buildId":"[^"]*"' | head -1)
          echo "serving $BUILD_ID"

          # Every script the page asks for must actually exist. Cache-bust so we
          # are testing the origin and not an old edge-cached copy.
          FAILED=0
          for PATH_ONLY in $(printf '%s' "$HTML" | grep -o '/_next/static/[^"]*\.js' | sort -u); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL%/}${PATH_ONLY}?deploycheck=$GITHUB_RUN_ID")
            if [ "$CODE" != "200" ]; then
              echo "::error::$CODE for $PATH_ONLY"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED script(s) referenced by the homepage are missing on the server."
            exit 1
          fi
          echo "all referenced scripts served 200"
