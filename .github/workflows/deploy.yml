name: Deploy (build on runner, ship over SSH)

on:
  push:
    branches:
      - zf-ai-labs
  workflow_dispatch: {}

# One production deploy at a time. A newer push waits for the running one to
# finish rather than racing it on the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # --- Build-time app env (NEXT_PUBLIC_* get inlined into the bundle here) ---
      WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
      WORDPRESS_AUTH_REFRESH_TOKEN: ${{ secrets.WORDPRESS_AUTH_REFRESH_TOKEN }}
      WORDPRESS_PREVIEW_SECRET: ${{ secrets.WORDPRESS_PREVIEW_SECRET }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_MEDIA_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_URL }}
      NEXT_PUBLIC_IMGIX_URL: ${{ secrets.NEXT_PUBLIC_IMGIX_URL }}
      NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
      NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_ENV: ${{ secrets.NEXT_PUBLIC_ENV }}
      # Enables Sentry source-map upload during the build.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Standalone output does not include the static assets or /public — copy
      # them next to server.js so the shipped bundle can serve on its own.
      # Standalone output does not include the static assets or /public - copy
      # them next to server.js so the shipped bundle can serve on its own.
      - name: Assemble standalone bundle
        run: |
          set -euo pipefail

          echo "--- what the build produced ---"
          ls -la .next/ || true
          ls -la .next/standalone/.next/ || true
          echo "static/ subdirs: $(ls .next/static 2>/dev/null | tr '\n' ' ')"

          test -d .next/standalone || { echo "::error::no .next/standalone - is output:'standalone' still set?"; exit 1; }
          test -d .next/static     || { echo "::error::no .next/static - the build produced no client assets"; exit 1; }

          # REWRITTEN 2026-08-18. This used to be a bare
          #   cp -r .next/static .next/standalone/.next/static
          # which is only correct while the destination does NOT exist. `cp -r src dst`
          # copies src INTO dst once dst is a directory, producing
          # .next/standalone/.next/static/static/chunks/... - so every
          # /_next/static/chunks/*.js 404s while the HTML still references it.
          # That is exactly how the site ended up styled but unhydrated.
          # `cp -R src/. dst/` copies the CONTENTS and gives the same layout either way.
          rm -rf .next/standalone/.next/static .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -R public/. .next/standalone/public/
          fi

          # A bundle whose chunks are missing or nested renders HTML that points
          # at 404s and never hydrates. Fail here rather than shipping it.
          test ! -d .next/standalone/.next/static/static \
            || { echo "::error::nested static/static - assembly is wrong"; exit 1; }
          test -d .next/standalone/.next/static/chunks \
            || { echo "::error::no static/chunks in the assembled bundle"; exit 1; }
          CHUNKS=$(find .next/standalone/.next/static/chunks -name '*.js' | wc -l | tr -d ' ')
          echo "assembled static/chunks JS files: $CHUNKS"
          test "$CHUNKS" -gt 0 \
            || { echo "::error::static/chunks is empty"; exit 1; }

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key from a secret if provided; otherwise trust-on-first-use.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ship bundle to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes"
          # Ensure target dir exists, then sync the assembled bundle.
          # --delete removes files no longer in the build; .env lives outside
          # this tree (written in the next step) so it is never touched.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/current'"
          # `--delete` REMOVED 2026-08-18. DO NOT PUT IT BACK without a
          # two-directory (build-then-symlink-swap) release layout.
          # Assets here are content-hashed, so a new build never overwrites an
          # old file - it only adds. `--delete` bought nothing except a window,
          # from the first deleted file until PM2 finished reloading, in which
          # the running server's own chunks were gone from disk. Anyone loading
          # the site in that window got HTML pointing at 404s. Worse, if a sync
          # ends early for any reason, `--delete` has already destroyed the
          # assets the currently-running build needs, and the site stays broken
          # until the next successful deploy.
          # Without it a partial sync is harmless: old files keep serving until
          # the new ones are fully in place and PM2 swaps over.
          rsync -az \
            -e "ssh $SSH_OPTS" \
            .next/standalone/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/current/"

      - name: Write runtime env + reload PM2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes"

          # Build the runtime .env locally from secrets, then copy it up. Only
          # server-side vars matter at runtime (NEXT_PUBLIC_* are already inlined),
          # but writing the full set keeps the file self-documenting.
          cat > runtime.env <<'EOF'
          NODE_ENV=production
          PORT=3000
          HOSTNAME=127.0.0.1
          WORDPRESS_API_URL=${{ secrets.WORDPRESS_API_URL }}
          WORDPRESS_AUTH_REFRESH_TOKEN=${{ secrets.WORDPRESS_AUTH_REFRESH_TOKEN }}
          WORDPRESS_PREVIEW_SECRET=${{ secrets.WORDPRESS_PREVIEW_SECRET }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_MEDIA_URL=${{ secrets.NEXT_PUBLIC_MEDIA_URL }}
          NEXT_PUBLIC_IMGIX_URL=${{ secrets.NEXT_PUBLIC_IMGIX_URL }}
          NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV }}
          EOF

          # Land .env at the app root (one level above the synced bundle).
          # Piped over the ssh shell channel instead of scp: modern scp uses the
          # SFTP subsystem, which is disabled on many hardened servers even when
          # shell/rsync work fine (the "Connection closed" failure mode).
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "cat > '$DEPLOY_PATH/.env'" < runtime.env
          rm -f runtime.env

          # Reload the app. startOrReload is idempotent: it starts the app on the
          # first deploy and does a zero-downtime reload on subsequent ones.
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && pm2 startOrReload ecosystem.config.js --update-env && pm2 save"

      # Added 2026-08-18. The deploy that broke the site reported success:
      # rsync was fine, PM2 reloaded, the homepage returned 200 - and every
      # script tag in that 200 pointed at a 404. Nothing in the pipeline looked
      # at what the site actually served. This step does.
      #
      # It must distinguish two very different non-200s. A 404/5xx means the
      # file is genuinely missing and the deploy is broken - fail. A 403/429 is
      # Cloudflare bot protection turning away a request from a datacentre IP;
      # that says nothing about the origin, so warn and pass rather than block a
      # good deploy. (The first version of this step failed exactly that way:
      # `curl: (22) The requested URL returned error: 403`.)
      - name: Smoke test the deployed page
        run: |
          set -uo pipefail
          URL="https://wdi-wow.online"
          UA="Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"

          # Let PM2 finish swapping the process.
          sleep 15

          HTTP=$(curl -sS -A "$UA" -o page.html -w '%{http_code}' --max-time 30 "$URL/" || echo 000)
          if [ "$HTTP" = "403" ] || [ "$HTTP" = "429" ]; then
            echo "::warning::Cloudflare answered $HTTP to the runner - skipping smoke test (this is edge bot protection, not a deploy failure)."
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::error::homepage returned $HTTP"
            exit 1
          fi

          BUILD_ID=$(grep -o '"buildId":"[^"]*"' page.html | head -1)
          echo "serving $BUILD_ID"

          SCRIPTS=$(grep -o '/_next/static/[^"]*\.js' page.html | sort -u)
          if [ -z "$SCRIPTS" ]; then
            echo "::error::homepage references no /_next/static scripts at all"
            exit 1
          fi

          MISSING=0
          BLOCKED=0
          CHECKED=0
          for P in $SCRIPTS; do
            # Cache-bust so this tests the origin and not an old edge-cached copy.
            CODE=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' --max-time 20 "$URL$P?deploycheck=$GITHUB_RUN_ID")
            CHECKED=$((CHECKED + 1))
            case "$CODE" in
              200) ;;
              403|429) BLOCKED=$((BLOCKED + 1)) ;;
              *) echo "::error::$CODE for $P"; MISSING=$((MISSING + 1)) ;;
            esac
          done

          echo "checked $CHECKED script(s): $MISSING missing, $BLOCKED blocked by the edge"
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING script(s) referenced by the homepage are missing on the server - the page will not hydrate."
            exit 1
          fi
          if [ "$BLOCKED" -gt 0 ]; then
            echo "::warning::$BLOCKED request(s) were answered 403/429 by Cloudflare and could not be verified."
          fi
          echo "all reachable scripts served 200"
